version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: nest-cassandra-test
    ports:
      - '9042:9042'
    environment:
      - CASSANDRA_CLUSTER_NAME=nest_test_cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    healthcheck:
      test: ['CMD', 'cqlsh', '-e', 'describe keyspaces']
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  cassandra_data:
